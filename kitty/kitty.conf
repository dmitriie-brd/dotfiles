include current-theme.conf

# font_family JetBrainsMono Nerd Font Mono
font_family Fira Code Nerd Font
font_size 11.0

tab_bar_style powerline
tab_powerline_style angled
tab_bar_edge top
# tab_title_template "{index}-{fmt.fg.tab}{title}"
tab_activity_symbol '*'
tab_title_template "{index}-{activity_symbol}{fmt.fg.tab}{title}{activity_symbol}"
tab_bar_min_tabs 1

scrollback_lines 30000
#scrollback_pager moar --no-linenumbers -style dracula
#scrollback_pager slit
scrollback_pager ov

mouse_map left click ungrabbed no-op
enable_audio_bell no
paste_actions quote-urls-at-prompt
enabled_layouts vertical,fat,grid,horizontal,stack,tall,vertical
select_by_word_characters @-./_~?&=%+#:
